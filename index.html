<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADHD Cleaning Planner 2027 · Home Reset</title>
<style>
:root{--bg:#EFEFEF;--paper:#fff;--tx:#1E2A30;--tx2:#494949;--line:#DADADA;--pri:#153A4C;--pri2:#2E5A6E;--mint:#DCE6EA;--mint2:#F5F7F8;--coral:#494949;--coralbg:#E4E4E4;--lilac:#6E8F9E;--lilacbg:#E3EBEE;--sky:#4F7486;--skybg:#E8EEF1;--ok:#153A4C;--okbg:#DCE6EA;--warn:#494949;--warnbg:#E4E4E4;--sh:0 1px 2px rgba(30,43,44,.05),0 8px 24px rgba(30,43,44,.07);--serif:Georgia,"Iowan Old Style",serif;--sans:Inter,"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
html[data-theme=dark]{--ok:#A9BFC8;--warn:#EFEFEF;--bg:#0F1F27;--paper:#16303D;--tx:#EFEFEF;--tx2:#B5C2C8;--line:#24485A;--mint:#1D4256;--mint2:#183848;--coralbg:#2A2A2A;--lilacbg:#203E4C;--skybg:#1D3A48;--okbg:#1D4256;--warnbg:#2A2A2A;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);--pri2:#2E5A6E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}input,select,textarea{font-family:inherit;font-size:14px;color:var(--tx);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri2)}
.app{display:flex;min-height:100vh}
#side{width:236px;flex:0 0 236px;background:var(--pri);color:#DCE6EA;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;z-index:60}
html[data-theme=dark] #side{background:#0B1A21;border-right:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 16px}.brand img{width:44px;height:44px;border-radius:11px}.brand b{font-family:var(--serif);font-size:18px;line-height:1.1;color:#fff}
.nv{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#DCE6EA;padding:10px 12px;border-radius:12px;margin:2px 0;font-weight:600;text-align:left}
.nv:hover{background:rgba(255,255,255,.07)}.nv.on{background:#DCE6EA;color:#153A4C}.nv .ic{width:20px;height:20px;display:flex}.nv .ic svg{width:20px;height:20px}
.nv .cnt{margin-left:auto;background:var(--coral);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px}
.sfoot{margin-top:auto;font-size:12px;color:#A9BFC8;padding:10px 8px 0}
main{flex:1;min-width:0;padding:22px 28px 60px}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;position:sticky;top:0;z-index:40;background:var(--bg);padding:6px 0}
header.top h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center}.ib svg{width:19px;height:19px}
.ib.ham{display:none}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;gap:7px;background:var(--mint);color:var(--pri)}
html[data-theme=dark] .btn{color:var(--tx)}
.btn.t{background:var(--pri);color:#fff}html[data-theme=dark] .ck.on{background:#2E5A6E;border-color:#2E5A6E}html[data-theme=dark] .btn.t{background:var(--pri2)}
.btn.c{background:var(--coral);color:#fff}.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--tx)}.btn.sm{padding:7px 12px;font-size:13px}
.btn svg{width:17px;height:17px}
#tpill{display:none;align-items:center;gap:7px;background:var(--coral);color:#fff;border:0;border-radius:99px;padding:8px 14px;font-weight:800}#tpill.on{display:inline-flex}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:7px 13px;font-weight:600;font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}html[data-theme=dark] .chip.on{background:var(--pri2);border-color:var(--pri2)}
#sampleChip{background:var(--coralbg);border-color:transparent;color:var(--warn);font-weight:700}
.card{background:var(--paper);border-radius:18px;box-shadow:var(--sh);padding:18px}
.k{font-weight:700;font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}.k .r{margin-left:auto;font-weight:600;font-size:12.5px;color:var(--tx2)}
.g{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g32{grid-template-columns:1.6fr 1fr}
.mut{color:var(--tx2)}.small{font-size:12.5px}
.empty{color:var(--tx2);text-align:center;padding:22px 10px;font-size:13.5px}
/* hero scene */
.hero{background:var(--paper);border-radius:24px;box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.htop{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:22px 24px 6px}
.htop h2{font-family:var(--serif);font-weight:400;font-size:32px;margin:0;line-height:1.1}.htop p{margin:6px 0 0;color:var(--tx2)}
.energy{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.energy>span{font-size:13px;font-weight:700;color:var(--tx2);margin-right:2px}
.scene{position:relative;padding:0 10px 4px}.scene svg{display:block;width:100%;height:auto}
.hot{cursor:pointer}.hot .lift{transition:transform .25s cubic-bezier(.2,1.4,.4,1);transform-box:fill-box;transform-origin:center bottom}.hot:hover .lift{transform:translateY(-5px)}
.hot:hover .lbl rect{fill:var(--coral)}
.room{cursor:pointer}.room:hover .rbg{fill:#E8EEF1}html[data-theme=dark] .room:hover .rbg{fill:#F5F7F8}
.objgrid{display:none}
.hint{position:absolute;right:22px;bottom:16px;background:var(--pri);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:6px 12px}
/* tiles */
.stat{border-radius:18px;padding:16px 18px;color:#fff;box-shadow:var(--sh)}.stat span{font-size:12.5px;opacity:.88;display:block}.stat b{display:block;font-family:var(--serif);font-size:30px;font-weight:400;margin:4px 0 0}.stat em{font-style:normal;font-size:12px;opacity:.88}
.task{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}
.ck{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:2px solid var(--pri2);background:none;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ck svg{width:15px;height:15px;opacity:0}.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}.ck.on svg{opacity:1}.ck:hover{background:var(--mint)}.ck.fr{background:var(--mint);border-color:var(--mint);color:var(--pri)}.ck.fr svg{opacity:.7}html[data-theme=dark] .ck.fr{color:var(--tx)}
.task .mn{flex:1;min-width:0}.task .mn b{display:block;font-weight:600}.task .mn span{font-size:12.5px;color:var(--tx2)}
.task.done .mn b{text-decoration:line-through;color:var(--tx2)}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}.t-min{background:var(--mint);color:var(--pri)}html[data-theme=dark] .t-min{color:var(--tx)}
.t-d{background:var(--coralbg);color:var(--warn)}.t-w{background:var(--lilacbg);color:var(--lilac)}.t-m{background:var(--skybg);color:var(--sky)}
.acts{display:flex;gap:4px}.acts button{width:30px;height:30px;border-radius:9px;border:0;background:none;color:var(--tx2);display:flex;align-items:center;justify-content:center}.acts button:hover{background:var(--mint)}.acts svg{width:16px;height:16px}
.bar{height:10px;border-radius:99px;background:var(--mint);overflow:hidden;display:flex}.bar i{display:block;height:100%}
/* page hero */
.phero{background:var(--pri);color:#fff;border-radius:20px;padding:16px 20px;display:flex;gap:18px;align-items:center;margin-bottom:12px;box-shadow:var(--sh)}
html[data-theme=dark] .phero{background:#0B1A21;border:1px solid var(--line)}
.phero .pa{width:92px;height:92px;flex:0 0 92px;border-radius:20px;background:#F5F7F8;display:flex;align-items:center;justify-content:center}.phero .pa svg{width:80px;height:80px}
.phero p{margin:0;font-family:var(--serif);font-size:20px;line-height:1.3;flex:1}
.how{display:flex;align-items:center;gap:10px;background:var(--mint);border-radius:14px;padding:10px 38px 10px 14px;margin-bottom:16px;position:relative;flex-wrap:wrap}
.how .st{display:flex;gap:8px;align-items:center;font-size:13px;flex:1;min-width:190px}.how .st i{font-style:normal;width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--pri);color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.how .hx{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--tx2);padding:4px 6px}
.howbtn{border:0;background:var(--mint);color:var(--tx2);font-size:12px;font-weight:700;border-radius:99px;padding:6px 12px;margin-bottom:14px}
/* quick reset */
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.preset{display:flex;gap:12px;align-items:center;text-align:left;border:0;background:var(--paper);box-shadow:var(--sh);border-radius:16px;padding:14px;width:100%}
.preset .pi{width:46px;height:46px;flex:0 0 46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff}.preset .pi svg{width:22px;height:22px}
.preset b{display:block}.preset span{font-size:12.5px;color:var(--tx2)}.preset:hover{transform:translateY(-2px)}.preset{transition:transform .2s}
/* timer */
.tw{display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{position:relative;width:300px;height:300px}.ring svg{width:300px;height:300px}.ring .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tt b{font-family:var(--serif);font-weight:400;font-size:64px;line-height:1}.ring .tt span{color:var(--tx2);font-size:13px;margin-top:6px}
.buddy{display:flex;gap:14px;align-items:center;background:var(--mint2);border-radius:16px;padding:14px}.buddy svg{width:90px;height:90px;flex:0 0 90px}
.buddy.go .bob{animation:bob 1.2s ease-in-out infinite}.buddy.go .sw{animation:sw .8s ease-in-out infinite;transform-origin:62px 40px}
@keyframes bob{50%{transform:translateY(-4px)}}@keyframes sw{50%{transform:rotate(-14deg)}}
/* rooms */
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rc{background:var(--paper);border-radius:18px;box-shadow:var(--sh);overflow:hidden;cursor:pointer;border:0;padding:0;text-align:left;transition:transform .2s}.rc:hover{transform:translateY(-3px)}
.rc .art{background:#F5F7F8;display:block}.rc .art svg{display:block;width:100%;height:auto}
.rc .bd{padding:12px 14px}.rc .bd b{font-family:var(--serif);font-size:19px;font-weight:400}
.fresh{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--tx2)}.fresh .bar{flex:1;height:8px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.zone{display:flex;gap:16px;align-items:center;background:var(--lilacbg);border-radius:18px;padding:14px 18px;margin-bottom:16px}.zone svg{width:120px;height:auto;flex:0 0 120px;border-radius:12px;background:#F5F7F8}
.zone b{font-family:var(--serif);font-size:22px;font-weight:400;display:block}
/* doom */
.pile{background:var(--paper);border-radius:18px;box-shadow:var(--sh);padding:16px}
.steps{display:grid;gap:6px;margin:10px 0}.step{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--mint2);border:0;text-align:left;width:100%}
.step i{font-style:normal;width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--pri)}
.step.on{background:var(--okbg)}.step.on i{background:var(--ok);color:#fff}.step.on span{text-decoration:line-through;color:var(--tx2)}
/* declutter */
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.day{border:0;background:var(--paper);box-shadow:var(--sh);border-radius:14px;padding:10px;text-align:left;min-height:92px;display:flex;flex-direction:column;gap:4px}
.day b{font-size:12px;color:var(--tx2)}.day span{font-size:12.5px;font-weight:600;line-height:1.3}.day.on{background:var(--okbg)}.day.on b{color:var(--ok)}.day.today{outline:2.5px solid var(--coral)}
/* rewards */
.rw{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}.rw:last-child{border:0}.rw .mn{flex:1}.rw .cost{font-weight:800;color:var(--lilac)}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart i{display:block;width:100%;max-width:42px;border-radius:8px 8px 4px 4px;background:var(--pri2)}.chart span{font-size:11.5px;color:var(--tx2)}.chart em{font-style:normal;font-size:11px;font-weight:700}
/* modal & toast */
#mw{position:fixed;inset:0;background:rgba(18,30,31,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}#mw.on{display:flex}
#mb{background:var(--paper);border-radius:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:22px}#mb h3{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fgrid label{font-size:12.5px;font-weight:700;color:var(--tx2);display:flex;flex-direction:column;gap:5px}.fgrid .w{grid-column:1/-1}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--pri);color:#fff;border-radius:99px;padding:11px 20px;font-weight:700;z-index:300;transition:transform .3s;max-width:92vw;text-align:center}#toast.on{transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:250}
.done-list{display:flex;flex-wrap:wrap;gap:6px}.done-list span{background:var(--okbg);color:var(--ok);font-size:12.5px;font-weight:700;border-radius:99px;padding:5px 11px}
.scrim{display:none}
@media(max-width:1180px){.rgrid{grid-template-columns:1fr 1fr}.days{grid-template-columns:repeat(5,1fr)}}
@media(max-width:900px){
 #side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s}#side.on{transform:none}
 .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
 .ib.ham{display:flex}main{padding:12px 14px 60px}header.top h1{font-size:21px}
 .g2,.g3,.g32,.cols{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.rgrid{grid-template-columns:1fr 1fr;gap:10px}.days{grid-template-columns:repeat(3,1fr)}
 .htop{padding:16px 16px 4px}.htop h2{font-size:25px}.hide-m{display:none!important}

 .objgrid button{border:0;background:var(--mint2);border-radius:14px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:12px}.objgrid svg{width:60px;height:60px}
 .hint{display:none}.phero{padding:12px}.phero .pa{width:64px;height:64px;flex:0 0 64px}.phero .pa svg{width:56px;height:56px}.phero p{font-size:16px}
 .ring,.ring svg{width:250px;height:250px}.ring .tt b{font-size:52px}.stat b{font-size:24px}#tpill span{display:none}
 .zone{flex-direction:column;align-items:flex-start}.how .st{min-width:100%}
}
@media(max-width:420px){.rgrid{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}#thB{display:none}}

.mnav{margin:14px 6px 6px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12)}
.mhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.mhd b{font-family:var(--serif);font-size:20px;color:#fff;font-weight:400}
.mhd button{width:28px;height:28px;border:0;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;font-size:17px;line-height:1}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mgrid button{position:relative;border:0;border-radius:10px;padding:8px 0;background:rgba(255,255,255,.06);color:#DCE6EA;font-weight:600;font-size:13px}
.mgrid button:hover{background:rgba(255,255,255,.14)}.mgrid button.now{outline:1.5px solid #A9BFC8}.mgrid button.on{background:#DCE6EA;color:#153A4C}
.mgrid i{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:#A9BFC8}
.mhero{background:var(--pri);color:#fff;border-radius:22px;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;box-shadow:var(--sh);overflow:hidden}
html[data-theme=dark] .mhero{background:#0B1A21;border:1px solid var(--line)}
.mhero h2{font-family:var(--serif);font-weight:400;font-size:44px;margin:0;line-height:1.05}.mhero p{margin:6px 0 0;color:#C9D6DC}.mhero .small{color:#A9BFC8;font-weight:700;font-size:14px}

.cd b{font-size:13px;font-weight:700}.cd em{font-style:normal;font-size:10.5px;opacity:.85}
.cd.l1{background:#C9D6DC}.cd.l2{background:#4F7486;color:#fff}.cd.l3{background:#153A4C;color:#fff}.cd.fut{opacity:.45}.cd.td{outline:2.5px solid #494949}
html[data-theme=dark] .cd.l1{background:#2E5A6E}html[data-theme=dark] .cd.l3{background:#A9BFC8;color:#153A4C}html[data-theme=dark] .cd.td{outline-color:#EFEFEF}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;align-items:center}.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px}.legend .l1{background:#C9D6DC}.legend .l2{background:#4F7486}.legend .l3{background:#153A4C}

.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.mstats div{background:var(--mint2);border-radius:12px;padding:10px;text-align:center}.mstats b{display:block;font-family:var(--serif);font-weight:400;font-size:24px}.mstats span{font-size:12px;color:var(--tx2)}
@media(max-width:900px){.mhero h2{font-size:32px}.mnum b{font-size:60px}.bigjob{flex-direction:column;align-items:flex-start}.cd em{display:none}}
.hsub{font-size:13px;font-weight:700;color:var(--tx2);margin-top:4px}#dBar{position:sticky;top:0;z-index:95;display:flex;align-items:center;justify-content:center;gap:12px;background:#153A4C;color:#EFEFEF;font-size:13px;padding:8px 14px;min-height:44px;flex-wrap:wrap;border-bottom:1px solid #24485A}

#dBar a{background:#EFEFEF;color:#153A4C;font-weight:700;border-radius:999px;padding:6px 14px;text-decoration:none}
#side{top:44px!important;height:calc(100vh - 44px)!important}header.top{top:44px!important}
#dWall{display:none;position:fixed;inset:0;z-index:300;background:rgba(21,58,76,.6);align-items:center;justify-content:center;padding:16px}#dWall.on{display:flex}
.dBox{background:#fff;border-radius:24px;max-width:460px;padding:28px;color:#153A4C;box-shadow:0 20px 60px rgba(21,58,76,.4)}
.dK{font-size:13px;color:#494949;font-weight:700}.dBox h3{font-family:var(--serif);font-weight:400;color:#153A4C;font-size:24px;margin:8px 0 10px}.dBox p{font-size:14px;line-height:1.6;margin:0 0 18px;color:#494949}
.dBtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.dBtns button,.dBtns a{border-radius:14px;padding:10px 16px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;border:0}.dBtns button{background:#DCE6EA;color:#153A4C}.dBtns a{background:#153A4C;color:#fff}
@media(max-width:900px){#side{top:0!important;height:100vh!important}#dBar .dt{display:none}.dTrack{width:70px}#dBar{font-size:11.5px;gap:8px}}
@media print{#dBar,#dWall{display:none!important}}

<style id="clay">
/* ===== Claymorphism layer (CLAY-v1): soft molded-clay surfaces, high visibility ===== */
:root{--bg:#E7ECEF;--clay:0 16px 32px rgba(21,58,76,.13),0 4px 10px rgba(21,58,76,.08),inset 0 2px 4px rgba(255,255,255,.95),inset 0 -6px 12px rgba(21,58,76,.06);--clay-sm:0 8px 18px rgba(21,58,76,.11),0 2px 6px rgba(21,58,76,.07),inset 0 2px 3px rgba(255,255,255,.95),inset 0 -4px 8px rgba(21,58,76,.05);--clay-in:inset 0 3px 8px rgba(21,58,76,.12),inset 0 -2px 4px rgba(255,255,255,.9);--sh:var(--clay)}
html[data-theme=dark]{--clay:0 16px 32px rgba(0,0,0,.45),0 4px 10px rgba(0,0,0,.3),inset 0 2px 3px rgba(255,255,255,.08),inset 0 -6px 12px rgba(0,0,0,.28);--clay-sm:0 8px 18px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.28),inset 0 2px 3px rgba(255,255,255,.08),inset 0 -4px 8px rgba(0,0,0,.25);--clay-in:inset 0 3px 8px rgba(0,0,0,.35),inset 0 -2px 4px rgba(255,255,255,.06);--sh:var(--clay)}
body{font-size:15px;line-height:1.5}
:focus-visible{outline:3px solid #2E5A6E;outline-offset:2px}
.card{border-radius:22px}
.hero{border-radius:28px}
.stat{border-radius:22px}
.stat span{font-size:13px;font-weight:600;opacity:1}
.stat b{font-size:32px}
.stat em{font-size:12.5px;opacity:1;font-weight:600}
.btn{border-radius:16px;padding:12px 18px;box-shadow:var(--clay-sm)}
.btn:active{transform:translateY(2px);box-shadow:var(--clay-in)}
.btn.t{background:linear-gradient(180deg,#2E5A6E,#153A4C);box-shadow:0 10px 20px rgba(21,58,76,.28),inset 0 2px 3px rgba(255,255,255,.25),inset 0 -4px 8px rgba(0,0,0,.2)}
.btn.c{background:linear-gradient(180deg,#5A5A5A,#3D3D3D);box-shadow:0 10px 20px rgba(0,0,0,.22),inset 0 2px 3px rgba(255,255,255,.2),inset 0 -4px 8px rgba(0,0,0,.2)}
.btn.ghost{background:var(--paper);border:2px solid var(--line)}
.chip{border-radius:99px;padding:9px 15px;font-size:13.5px;box-shadow:var(--clay-sm);border:0}
.chip.on{background:linear-gradient(180deg,#2E5A6E,#153A4C)}
.nv{border-radius:18px;padding:9px 10px;margin:3px 0;gap:10px}
.nv .ic{width:36px;height:36px;flex:0 0 36px;border-radius:13px;background:#DCE6EA;color:#153A4C;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 3px rgba(255,255,255,.9),inset 0 -3px 6px rgba(21,58,76,.12)}
.nv .ic svg{width:20px;height:20px}
.nv-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.nv-t b{font-size:14px;font-weight:800}
.nv-t i{font-style:normal;font-size:11.5px;opacity:.72;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv.on .nv-t i{opacity:1;color:#4C5F68}
.nv .cnt{font-size:12px;padding:3px 8px}
.ngrp{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8FA8B3;margin:16px 12px 6px}
.ngrp:first-child{margin-top:2px}
.k{font-size:16.5px;font-weight:800}
.k .r{font-size:13px;font-weight:700}
.task{padding:12px 6px}
.task .mn b{font-size:15px;font-weight:700}
.task .mn span{font-size:13px}
.ck{width:30px;height:30px;flex-basis:30px;border-width:2.5px}
.tag{font-size:12px;font-weight:800;padding:4px 10px}
.phero{border-radius:24px}
.phero .pa{border-radius:18px;box-shadow:var(--clay-sm)}
.how{border-radius:16px;box-shadow:var(--clay-sm)}
.how .st{font-size:13.5px;font-weight:600}
.preset{border-radius:20px}
.preset b{font-size:15px}
.preset span{font-size:13px}
.rc{border-radius:22px}
.rc .bd b{font-size:20px}
.fresh{font-size:13px;font-weight:600}
.day{border-radius:16px;min-height:96px}
.day span{font-size:13px}
.day.today{outline-width:3px}
.step{border-radius:14px;padding:10px 12px}
.pile{border-radius:22px}
#mb{border-radius:26px}
input,select,textarea{border-radius:14px;padding:11px 13px;border:2px solid #D3DDE2;background:#F8FAFB;box-shadow:var(--clay-in)}
.bar{height:12px;background:#D5DEE3;box-shadow:var(--clay-in)}
.bar i{border-radius:99px}
.chart i{border-radius:10px 10px 4px 4px}
.cd{border-radius:12px}
.mstats div{border-radius:14px;box-shadow:var(--clay-sm)}
.zone{border-radius:22px}
.objgrid button{border-radius:16px;box-shadow:var(--clay-sm)}
.done-list span{font-size:13px;padding:6px 12px}
.ib{border-radius:14px;box-shadow:var(--clay-sm);border:0}
#tpill{box-shadow:var(--clay-sm)}
.hint{box-shadow:var(--clay-sm)}
.mgrid button{border-radius:12px}
.mhero{border-radius:26px}
.bj-art{border-radius:22px;box-shadow:var(--clay-sm)}
.buddy{border-radius:20px;box-shadow:var(--clay-sm)}
header.top h1{font-size:28px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lk{width:38px;height:38px;flex:0 0 38px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--pri);box-shadow:inset 0 2px 3px rgba(255,255,255,.9),inset 0 -3px 6px rgba(21,58,76,.1)}
.lk svg{width:20px;height:20px}
.lrow .mn{flex:1;min-width:0}
.lrow .mn b{display:block;font-size:14.5px;font-weight:700}
.lrow .mn span{font-size:12.5px;color:var(--tx2)}
.lpts{font-weight:800;color:var(--lilac);font-size:14px}
@media(max-width:900px){.stat b{font-size:26px}}
.cols{grid-template-columns:repeat(2,1fr)}@media(max-width:900px){.cols{grid-template-columns:1fr!important}}
.tnote{display:block;font-size:12px;color:var(--tx2);font-weight:500}
.t-e-low{background:#DCE6EA;color:#153A4C}.t-e-med{background:#C9D3D8;color:#153A4C}.t-e-high{background:#494949;color:#fff}
.preset.on{outline:2.5px solid var(--pri);outline-offset:2px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}@media(max-width:700px){.modes{grid-template-columns:1fr}}
.rhythm{display:flex;align-items:flex-end;gap:10px;height:96px}.rhythm>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}.rhythm i{display:block;width:100%;max-width:36px;border-radius:8px 8px 4px 4px;background:var(--pri2)}.rhythm span{font-size:11.5px;color:var(--tx2)}.rhythm em{font-style:normal;font-size:11px;font-weight:700}
.ldel{border:0;background:none;color:var(--tx2);font-size:20px;line-height:1;padding:2px 6px;cursor:pointer}.ldel:hover{color:#B3261E}
.k{flex-wrap:wrap;row-gap:4px}
@media(max-width:900px){.mstats{grid-template-columns:repeat(2,1fr)!important}}
</style></head><body>

function tLeft(){const T=S.timer;if(!T)return 0;return T.paused?T.left:Math.max(0,Math.round((T.end-Date.now())/1000))}

function tPause(){const T=S.timer;if(!T)return;if(T.paused){T.end=Date.now()+T.left*1000;T.paused=false}else{T.left=tLeft();T.paused=true}save();rerender();tick()}
function tStop(){if(!S.timer)return;clearInterval(tInt);const used=Math.round((S.timer.dur-tLeft())/60);if(used>=1){S.log.push({id:uid(),d:TD(),t:'Focus session · '+used+' min',room:'',min:used,pts:used,kind:'focus',at:timeStr()});toast('Stopped. '+used+' min still counts ✦ +'+used+' pts')}S.timer=null;save();rerender()}
function drawRing(){const T=S.timer;const l=tLeft();const p=T?l/T.dur:0;const r=130,c=2*Math.PI*r;const a=$('#rArc'),t=$('#rT');if(a)a.setAttribute('stroke-dasharray',(c*p)+' '+c);if(t)t.textContent=Math.floor(l/60)+':'+pad(l%60);const q=$('#bq');if(q&&T&&!T.paused){const k=Math.floor((T.dur-l)/40)%QUOTES.length;if(q.dataset.k!=k){q.dataset.k=k;q.textContent=QUOTES[k]}}}
V.timer=()=>{const T=S.timer;const r=130,c=2*Math.PI*r;const l=T?tLeft():0;const p=T?l/T.dur:0;const run=T&&!T.paused;
 const focus=S.log.filter(x=>x.kind==='focus');
 return '<div class="g g32"><div class="card tw"><div class="opts" style="justify-content:center">'+[5,10,15,25].map(m=>'<button class="chip'+(T&&T.dur===m*60?' on':'')+'" onclick="startTimer('+m+')">'+m+' min</button>').join('')+'</div>'
 +'<div class="ring"><svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="'+r+'" fill="none" stroke="var(--mint)" stroke-width="22"/><circle id="rArc" cx="150" cy="150" r="'+r+'" fill="none" stroke="#494949" stroke-width="22" stroke-linecap="round" stroke-dasharray="'+(c*p)+' '+c+'" transform="rotate(-90 150 150)"/></svg><div class="tt"><b id="rT">'+(T?Math.floor(l/60)+':'+pad(l%60):'0:00')+'</b><span>'+(T?(T.paused?'Paused':'Keep going'):'Pick a time to start')+'</span></div></div>'
 +(T?'<div style="display:flex;gap:8px"><button class="btn t" onclick="tPause()">'+(T.paused?IC.play+' Resume':IC.pause+' Pause')+'</button><button class="btn ghost" onclick="tStop()">Stop</button><button class="btn" onclick="add5()">+5 min</button></div>':'<button class="btn c" onclick="startTimer(15)">'+IC.play+' Start 15 minutes</button>')
 +'<div class="buddy'+(run?' go':'')+'" style="width:100%">'+buddySVG()+'<div><b>Your cleaning buddy</b><div class="small mut" id="bq" style="margin-top:4px">'+(run?QUOTES[0]:'Start a timer and I’ll clean alongside you.')+'</div></div></div></div>'
 +'<div class="card"><div class="k">Why a timer helps</div><div class="small" style="line-height:1.7">ADHD brains often struggle to judge time and to start. A visible countdown makes the job feel smaller and gives it an end. When it rings, you are allowed to stop.</div>'
 +'<div class="k" style="margin-top:18px">Focus sessions<span class="r">'+focus.length+' total</span></div>'+(focus.slice(-6).reverse().map(x=>'<div class="task"><span class="tag t-min">'+x.min+' min</span><div class="mn"><b>'+esc(x.t)+'</b><span>'+(x.d===TD()?'today':dago(x.d)+' days ago')+' · +'+x.pts+' pts</span></div></div>').join('')||'<div class="empty">No sessions yet.</div>')+'</div></div>'};
const buddySVG=()=>`<svg viewBox="0 0 100 100"><ellipse cx="50" cy="92" rx="26" ry="5" fill="#000" opacity=".08"/><g class="bob"><path d="M22 86c0-30 10-50 28-50s28 20 28 50z" fill="${C.sage}"/><circle cx="41" cy="58" r="4" fill="${C.ink}"/><circle cx="59" cy="58" r="4" fill="${C.ink}"/><path d="M43 68q7 6 14 0" stroke="${C.ink}" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="35" cy="66" r="4" fill="${C.coral}" opacity=".5"/><circle cx="65" cy="66" r="4" fill="${C.coral}" opacity=".5"/><path d="M38 38q12-12 24 0" fill="${C.teal}"/></g><g class="sw"><rect x="60" y="20" width="4" height="58" rx="2" fill="${C.wood}" transform="rotate(20 62 50)"/><path d="M68 74h16l4 16H64z" fill="${C.coral}" transform="rotate(20 62 50)"/></g></svg>`;
/* ================= ROOMS ================= */
V.rooms=(id)=>{if(id&&R_(id))return roomV(R_(id));return '<div class="rgrid">'+S.rooms.map(r=>{const f=fresh(r);const due=r.tasks.filter(isDue).length;return '<button class="rc" onclick="go(\'rooms\',\''+r.id+'\')"><span class="art">'+roomArt(r)+'</span><div class="bd"><div style="display:flex;align-items:center;gap:8px"><b>'+esc(r.name)+'</b><span class="tag '+(due?'t-d':'t-min')+'" style="margin-left:auto">'+(due?due+' to do':'✓ fresh')+'</span></div><div class="fresh"><div class="bar"><i style="width:'+f*100+'%;background:'+(f>=.75?'#153A4C':f>=.5?'#4F7486':'#494949')+'"></i></div>'+Math.round(f*100)+'%</div></div></button>'}).join('')+'<button class="rc" onclick="editRoom()" style="display:flex;align-items:center;justify-content:center;min-height:180px;background:var(--mint2)"><b style="font-family:var(--sans);font-size:15px">＋ Add a room</b></button></div>'};
function roomV(r){const f=fresh(r);const grp=['daily','3days','weekly','2weeks','monthly','once'];const lc=r.tasks.map(t=>t.last).filter(Boolean).sort().reverse()[0];const tot=r.tasks.reduce((s,t)=>s+t.min,0);
 return '<div class="g g32"><div>'+grp.map(g=>{const L=r.tasks.filter(t=>t.f===g);if(!L.length)return '';return '<div class="card" style="margin-bottom:16px"><div class="k"><span class="tag '+(g==='daily'?'t-d':g==='3days'?'t-w':g==='weekly'?'t-w':g==='2weeks'?'t-m':g==='once'?'t-d':'t-m')+'">'+FQL[g]+'</span><span class="r">'+L.filter(t=>!isDue(t)).length+' of '+L.length+' fresh</span></div>'+L.map(t=>'<div style="display:flex;align-items:center;gap:4px"><div style="flex:1">'+taskRow(r,t,0,1)+'</div><div class="acts"><button onclick="editTask(\''+r.id+'\',\''+t.id+'\')" title="Edit">'+IC.edit+'</button></div></div>').join('')+'</div>'}).join('')
 +'<button class="btn t" onclick="editTask(\''+r.id+'\')">'+IC.plus+' Add a task</button></div>'
 +'<div><div class="card" style="padding:0;overflow:hidden">'+roomArt(r)+'<div style="padding:16px"><div class="fresh" style="font-size:14px"><b style="color:var(--tx)">'+Math.round(f*100)+'% fresh</b><div class="bar"><i style="width:'+f*100+'%;background:'+(f>=.75?'#153A4C':f>=.5?'#4F7486':'#494949')+'"></i></div></div><div class="small mut" style="margin-top:10px">Last cleaned: '+(lc?(dago(lc)===0?'today':dago(lc)===1?'yesterday':dago(lc)+' days ago'):'never yet')+' · '+tot+' min of tasks</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn c" onclick="S.qr.room=\''+r.id+'\';S.qr.min=15;save();go(\'reset\')">'+IC.spark+' 15-min reset here</button><button class="btn ghost sm" onclick="go(\'rooms\')">All rooms</button><button class="btn ghost sm" onclick="editRoom(\''+r.id+'\')">Rename</button></div></div></div></div></div>'}
function editTask(rid,tid){const r=R_(rid),t=tid?r.tasks.find(x=>x.id===tid):{t:'',min:5,f:'weekly',e:'med',note:''};
 openM('<h3>'+(tid?'Edit task':'New task')+'</h3><div class="fgrid"><label class="w">Task<input id="f_t" value="'+esc(t.t)+'" placeholder="e.g. Wipe the stove"></label><label>Minutes<input id="f_m" type="number" min="1" value="'+t.min+'"></label><label>How often<select id="f_f">'+Object.keys(FQ).map(k=>'<option value="'+k+'"'+(t.f===k?' selected':'')+'>'+FQL[k]+'</option>').join('')+'</select></label><label>Energy<select id="f_e">'+[['low','Low energy'],['med','Medium energy'],['high','High energy']].map(x=>'<option value="'+x[0]+'"'+((t.e||'med')===x[0]?' selected':'')+'>'+x[1]+'</option>').join('')+'</select></label><label class="w">Supplies note (optional)<input id="f_n" value="'+esc(t.note||'')+'" placeholder="e.g. All-purpose spray + cloth"></label></div><div class="mfoot">'+(tid?'<button class="btn ghost" style="margin-right:auto;color:#494949" onclick="if(confirm(\'Delete this task?\')){R_(\''+rid+'\').tasks=R_(\''+rid+'\').tasks.filter(x=>x.id!==\''+tid+'\');save();closeM();rerender()}">Delete</button>':'')+'<button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn t" onclick="saveTask(\''+rid+'\',\''+(tid||'')+'\')">Save</button></div>');setTimeout(()=>($('#f_t')||{focus(){}}).focus(),50)}
function saveTask(rid,tid){const o={t:$('#f_t').value.trim(),min:Math.max(1,+$('#f_m').value||5),f:$('#f_f').value,e:$('#f_e').value,note:$('#f_n').value.trim()};if(!o.t){toast('Give the task a name');return}const r=R_(rid);if(tid)Object.assign(r.tasks.find(x=>x.id===tid),o);else r.tasks.push(Object.assign({id:uid(),last:''},o));save();closeM();rerender();toast('Saved ✓')}
function editRoom(id){const r=id?R_(id):{name:''};openM('<h3>'+(id?'Rename room':'New room')+'</h3><div class="fgrid"><label class="w">Room name<input id="f_n" value="'+esc(r.name)+'" placeholder="e.g. Kids’ room, Office"></label></div><div class="mfoot">'+(id?'<button class="btn ghost" style="margin-right:auto;color:#494949" onclick="if(confirm(\'Delete this room and its tasks?\')){S.rooms=S.rooms.filter(x=>x.id!==\''+id+'\');save();closeM();go(\'rooms\')}">Delete room</button>':'')+'<button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn t" onclick="saveRoom(\''+(id||'')+'\')">Save</button></div>')}
function saveRoom(id){const n=$('#f_n').value.trim();if(!n){toast('Give the room a name');return}if(id)R_(id).name=n;else{const nid='r'+uid();S.rooms.push({id:nid,name:n,tasks:[{id:uid(),t:'Quick tidy',min:5,f:'daily',last:''},{id:uid(),t:'Dust and vacuum',min:15,f:'weekly',last:''}]});id=nid}save();closeM();go('rooms',id)}
/* ================= ROUTINES ================= */
function weekZone(){const d=today();const wk=Math.floor((d-new Date(d.getFullYear(),0,1))/(7*864e5));return S.rooms.length?S.rooms[wk%S.rooms.length]:null}
V.routines=()=>{const z=weekZone();const col=(fs,title,cls,note)=>{const L=dueListF(fs);const left=L.filter(x=>!doneToday(x.t)).length;return '<div class="card"><div class="k"><span class="tag '+cls+'">'+title+'</span><span class="r">'+(left?left+' left':'all done ✦')+'</span></div>'+(L.map(x=>taskRow(x.r,x.t,1,1)).join('')||'<div class="empty">'+note+'</div>')+'</div>'};
 const up=S.rooms.flatMap(r=>r.tasks.filter(t=>t.f!=='once'&&!isDue(t)&&!doneToday(t)).map(t=>({r,t}))).sort((a,b)=>((FQ[a.t.f]-dago(a.t.last))-(FQ[b.t.f]-dago(b.t.last))));return (z?'<div class="zone"><svg viewBox="0 0 150 120">'+'<rect width="150" height="120" fill="'+C.wall+'"/>'+room(z.id)+'</svg><div><span class="small mut">Zone of the week</span><b>'+esc(z.name)+'</b><div class="small" style="margin:4px 0 10px">Give this room 15 extra minutes this week. Next week, the next room.</div><button class="btn t sm" onclick="go(\'rooms\',\''+z.id+'\')">Open '+esc(z.name)+'</button></div></div>':'')
 +'<div class="cols">'+col(['daily'],'Today','t-d','Daily tasks are done ✦')+col(['3days','weekly'],'This week','t-w','Weekly tasks are done ✦')+col(['2weeks','monthly'],'This month','t-m','Monthly tasks are done ✦')+col(['once'],'One-time','t-d','No one-time tasks')+'</div>'+'<div class="card" style="margin-top:16px"><div class="k">Coming up<span class="r">'+up.length+' tasks · not due yet</span></div>'+(up.map(x=>taskRow(x.r,x.t,1)).join('')||'<div class="empty">Nothing coming up. Everything is due or done ✦</div>')+'</div>'};
/* ================= DOOM ================= */
const pileDone=p=>DOOM.every((_,i)=>p.steps&&p.steps[i]);
V.doom=()=>{const open=S.piles.filter(p=>!pileDone(p)),cleared=S.piles.filter(pileDone);
 return '<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap"><button class="btn t" onclick="editPile()">'+IC.plus+' Add a doom pile</button><span class="small mut">'+cleared.length+' pile'+(cleared.length===1?'':'s')+' cleared · +20 pts each</span></div><div class="g g3">'+open.map(pileCard).join('')+(open.length?'':'<div class="card empty" style="grid-column:1/-1">No doom piles right now. If one appears, add it here and sort it in small steps.</div>')+'</div>'
 +(cleared.length?'<div class="k" style="margin-top:22px">Cleared piles ✦</div><div class="done-list">'+cleared.map(p=>'<span>✓ '+esc(p.name)+'</span>').join('')+'</div>':'')};
function pileCard(p){const n=DOOM.filter((_,i)=>p.steps[i]).length;return '<div class="pile"><div style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1"><b style="font-family:var(--serif);font-size:19px;font-weight:400">'+esc(p.name)+'</b><div class="small mut">'+esc(p.where||'')+' · '+esc(p.size)+'</div></div><div class="acts"><button onclick="editPile(\''+p.id+'\')">'+IC.edit+'</button></div></div><div class="steps">'+DOOM.map((s,i)=>'<button class="step'+(p.steps[i]?' on':'')+'" onclick="pileStep(\''+p.id+'\','+i+',this)"><i>'+(p.steps[i]?'✓':i+1)+'</i><span>'+s+'</span></button>').join('')+'</div><div class="bar" style="height:8px"><i style="width:'+n/DOOM.length*100+'%;background:#153A4C"></i></div></div>'}
function pileStep(id,i,el){const p=S.piles.find(x=>x.id===id);p.steps[i]=p.steps[i]?0:1;if(pileDone(p)){S.log.push({id:uid(),d:TD(),t:'Cleared: '+p.name,room:'',min:10,pts:20,pile:id,at:timeStr()});save();rerender();confetti();toast('Doom pile cleared! +20 pts ✦')}else{const k=S.log.findIndex(x=>x.pile===id);if(k>=0)S.log.splice(k,1);save();if(p.steps[i])cheer(el,'');rerender()}}
function editPile(id){const p=id?S.piles.find(x=>x.id===id):{name:'',where:'',size:'Medium'};openM('<h3>'+(id?'Edit pile':'New doom pile')+'</h3><div class="fgrid"><label class="w">What is it?<input id="f_pn" value="'+esc(p.name)+'" placeholder="e.g. Chair of clothes"></label><label>Where<input id="f_pw" value="'+esc(p.where)+'"></label><label>Size<select id="f_ps">'+['Small','Medium','Big'].map(s=>'<option'+(p.size===s?' selected':'')+'>'+s+'</option>').join('')+'</select></label></div><div class="mfoot">'+(id?'<button class="btn ghost" style="margin-right:auto;color:#494949" onclick="if(confirm(\'Delete this pile?\')){S.piles=S.piles.filter(x=>x.id!==\''+id+'\');save();closeM();rerender()}">Delete</button>':'')+'<button class="btn ghost" onclick="closeM()">Cancel</button><button class="btn t" onclick="savePile(\''+(id||'')+'\')">Save</button></div>')}
function savePile(id){const o={name:$('#f_pn').value.trim(),where:$('#f_pw').value.trim(),size:$('#f_ps').value};if(!o.name){toast('Name the pile');return}if(id)Object.assign(S.piles.find(x=>x.id===id),o);else S.piles.unshift(Object.assign({id:uid(),steps:{},made:TD()},o));save();closeM();rerender();toast('Saved ✓')}
/* ================= DECLUTTER ================= */
V.declutter=()=>{const st=pd(S.dcl.start);const dn=Math.min(30,Math.max(1,Math.round((today()-st)/864e5)+1));const done=Object.keys(S.dcl.done).filter(k=>S.dcl.done[k]).length;
 return '<div class="g g4" style="margin-bottom:16px"><div class="stat" style="background:#6E8F9E"><span>Days done</span><b>'+done+' / 30</b><em>'+Math.round(done/30*100)+'% of the challenge</em></div><div class="stat" style="background:#153A4C"><span>Challenge day</span><b>Day '+dn+'</b><em>Started '+MS[st.getMonth()]+' '+st.getDate()+'</em></div><div class="card" style="grid-column:span 2;display:flex;align-items:center;gap:14px"><div style="flex:1"><b>Today: '+esc(DCL[dn-1])+'</b><div class="small mut">About 10 minutes. Trash it, donate it, or give it a home.</div></div><button class="btn c" onclick="dclT('+dn+',this)">'+(S.dcl.done[dn]?'✓ Done':'Mark done')+'</button></div></div>'
 +'<div class="days">'+DCL.map((t,i)=>'<button class="day'+(S.dcl.done[i+1]?' on':'')+(i+1===dn?' today':'')+'" onclick="dclT('+(i+1)+',this)"><b>Day '+(i+1)+(S.dcl.done[i+1]?' ✓':'')+'</b><span>'+esc(t)+'</span></button>').join('')+'</div><div style="margin-top:14px"><button class="btn ghost sm" onclick="if(confirm(\'Restart the challenge from today?\')){S.dcl={start:TD(),done:{}};save();rerender()}">Restart from today</button></div>'};
function dclT(n,el){S.dcl.done[n]=S.dcl.done[n]?0:1;if(S.dcl.done[n]){S.log.push({id:uid(),d:TD(),t:'Declutter: '+DCL[n-1],room:'',min:10,pts:10,dcl:n,at:timeStr()});cheer(el,'+10 pts')}else{const k=S.log.findIndex(x=>x.dcl===n);if(k>=0)S.log.splice(k,1)}save();rerender();if(Object.values(S.dcl.done).filter(Boolean).length===30){confetti();toast('30 days done! Amazing ✦')}}
/* ================= REWARDS ================= */
V.rewards=()=>{const bal=balance();const days=[...Array(7)].map((_,i)=>addD(i-6));const mx=Math.max(10,...days.map(dayMin));const bs=bestStreak(),br=busiestRoom(),tot=S.log.length,tmin=S.log.reduce((s,x)=>s+(+x.min||0),0);const wkRooms=new Set(S.log.filter(x=>dago(x.d)<7&&x.room).map(x=>x.room)).size;const l30=S.log.filter(x=>dago(x.d)<30);const l30m=l30.reduce((s,x)=>s+(+x.min||0),0);const act30=new Set(l30.map(x=>x.d)).size;const rhy=[0,1,2,3,4,5,6].map(d=>S.log.filter(x=>pd(x.d).getDay()===d).length);const rmax=Math.max(1,...rhy);const peak=rhy.indexOf(rmax);
 return '<div class="g g4" style="margin-bottom:16px"><div class="stat" style="background:#494949"><span>Points to spend</span><b>'+bal+'</b><em>'+earned()+' earned · '+spentPts()+' spent</em></div><div class="stat" style="background:#153A4C"><span>Kind streak</span><b>'+streak().n+' days</b><em>1 rest day a week is allowed</em></div><div class="stat" style="background:#6E8F9E"><span>Things done</span><b>'+S.log.length+'</b><em>since you started</em></div><div class="stat" style="background:#4F7486"><span>This week</span><b>'+days.reduce((s,d)=>s+dayMin(d),0)+' min</b><em>of cleaning and focus</em></div></div>'
 +'<div class="g g2"><div class="card"><div class="k">My reward menu<span class="r"><button class="btn sm" onclick="editRw()">'+IC.plus+' Add</button></span></div>'+S.rewards.map(r=>'<div class="rw"><span style="color:'+(bal>=r.cost?'#494949':'var(--tx2)')+'">'+IC.star.replace('<svg','<svg width="22" height="22"')+'</span><div class="mn"><b>'+esc(r.name)+'</b><div class="small mut">'+(bal>=r.cost?'You can have this now':'Need '+(r.cost-bal)+' more')+'</div></div><span class="cost">'+r.cost+'</span><button class="btn sm '+(bal>=r.cost?'c':'ghost')+'" onclick="redeem(\''+r.id+'\',this)"'+(bal>=r.cost?'':' disabled style="opacity:.5;cursor:default"')+'>Redeem</button><div class="acts"><button onclick="editRw(\''+r.id+'\')">'+IC.edit+'</button></div></div>').join('')+'</div>'
 +'<div class="card"><div class="k">Minutes per day</div><div class="chart">'+days.map(d=>{const m=dayMin(d);const dd=pd(d);return '<div><em>'+(m||'')+'</em><i style="height:'+Math.max(3,m/mx*110)+'px;'+(d===TD()?'background:#494949':'')+'"></i><span>'+DW[dd.getDay()]+'</span></div>'}).join('')+'</div>'
 +'<div class="k" style="margin-top:18px">Redeemed</div>'+(S.spent.slice().reverse().slice(0,5).map(x=>'<div class="rw"><div class="mn"><b>'+esc(x.name)+'</b><div class="small mut">'+(x.d===TD()?'today':dago(x.d)+' days ago')+'</div></div><span class="cost">−'+x.cost+'</span></div>').join('')||'<div class="empty">Nothing yet. Treat yourself, you earned it.</div>')+'<button class="btn ghost" style="margin-top:14px;width:100%;justify-content:center" onclick="go(\'log\')">'+IC.list+' See the full Cleaning Log</button></div></div>'
 +'<div class="card" style="margin-top:16px"><div class="k">Insights<span class="r">from your log</span></div>'
 +'<div class="mstats" style="grid-template-columns:repeat(4,1fr)"><div><b>'+bs+'</b><span>best streak (days)</span></div><div><b style="font-size:20px">'+(br?esc(br.name):'—')+'</b><span>busiest room'+(br?' · '+br.n+' cleans':'')+'</span></div><div><b>'+(tot?Math.round(tmin/tot):0)+' min</b><span>average per task</span></div><div><b>'+wkRooms+' of '+S.rooms.length+'</b><span>rooms cleaned this week</span></div></div>'
 +'<div class="small mut" style="margin:2px 0 14px">Last 30 days: <b style="color:var(--tx)">'+l30.length+' cleans · '+l30m+' min · '+act30+' active days</b></div>'
 +'<div class="k" style="font-size:14px">Weekly rhythm<span class="r">peak: '+DW[peak]+'</span></div>'
